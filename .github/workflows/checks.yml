name: Code Quality Checks

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standard:
    uses: msstc4symfony/bundle-standard/.github/workflows/php-bundle.yml@v3.2.0
    with:
      slug: msstc4symfony/logic-bundle
      extensions: 'mbstring, xml, ctype, iconv, intl, json'
      # Measured MSI 93.23 % on 2026-10-09 UTC, minus a margin for noise.
      infection-min-msi: 90
      infection-min-covered-msi: 90
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
